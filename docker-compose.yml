services:

  db:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: akolmychek/challenge_app:latest
    env_file: .env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    ports:
      - 8098:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/var/html/static
      - media_volume:/var/html/media
    depends_on:
      - backend

  redis:
    image: redis:latest
    command: --port 6380
    ports:
      - "6380:6379"

  celery:
    image: akolmychek/challenge_app:latest
    command: celery -A config worker --loglevel=info --logfile=celery_worker.log
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  celery-beat:
    image: akolmychek/challenge_app:latest
    command: celery -A config beat --loglevel=info --logfile=celery_beat.log
    env_file:
      - .env
    depends_on:
      - backend
      - celery
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:

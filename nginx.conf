server {
    listen 80;
    server_name 193.164.150.86;

    return 301 https://$host$request_uri;  # Перенаправление HTTP на HTTPS
}

server {
    listen 443 ssl;
    server_name 193.164.150.86;

    ssl_certificate /var/www/html/challenge_app_ssl/cert.pem;  # Путь к вашему сертификату
    ssl_certificate_key /var/www/html/challenge_app_ssl/key.pem;  # Путь к вашему закрытому ключу

    client_max_body_size 5M;
    server_tokens off;

    location /media/ {
        root /var/html;
    }

    location /static/ {
        root /var/html;
    }

    location /static/admin {
        root /var/html;
    }

     location /static/rest_framework/ {
        root /var/html/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:9000/admin/;
    }


    location / {
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /var/html/front/server/pages/;
      }
}

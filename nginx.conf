server {
    listen 443 ssl;
    server_name 193.164.150.86;  # Замените на ваш IP-адрес

    ssl_certificate /etc/ssl/certs/challenge_app.crt;
    ssl_certificate_key /etc/ssl/private/challenge_app.key;

    location / {
        proxy_pass http://backend:9000;  # Замените на адрес вашего Django приложения
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name 193.164.150.86;  # Замените на ваш IP-адрес

    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}